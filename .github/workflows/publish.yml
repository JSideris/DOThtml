name: Publish

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Publish if versions are new
        run: |
          local=$(node -p "require('./packages/dothtml/package.json').version")
          remote=$(npm view dothtml version)
          echo "Local version: $local"
          echo "NPM version:   $remote"
          if [ "$local" = "$remote" ]; then
            echo "Nothing to publish."
            exit 0
          fi
          npm run release
